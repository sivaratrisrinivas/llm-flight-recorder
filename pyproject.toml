[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmfr"
version = "0.1.0"
description = "LLM Flight Recorder: record, replay, and compare generations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "srinivassivaratri" }]
keywords = ["llm", "trace", "replay", "logits"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
]
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
hf = [
  "torch>=2.2",
  "transformers>=4.40",
]

[project.scripts]
llmfr = "llmfr.cli:main"

[project.urls]
Repository = "https://github.com/sivaratrisrinivas/llm-flight-recorder"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: downloads or runs a real Hugging Face model",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["llmfr"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
  "torch",
  "torch.*",
  "transformers",
  "transformers.*",
  "huggingface_hub",
  "huggingface_hub.*",
]
ignore_missing_imports = true
